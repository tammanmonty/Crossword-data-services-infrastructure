name: Terraform - Initialize State Management

on:
  workflow_dispatch  # Manual trigger only

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  init-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::{AWS_ACCOUNT_NUMBER}:role/github-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          cd terraform/state-backend
          terraform fmt -check

      - name: Terraform Init
        run: |
          cd terraform/state-backend
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform/state-backend
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform/state-backend
          terraform plan -no-color -out=tfplan

      - name: Review Plan
        run: |
          cd terraform/state-backend
          terraform show tfplan

      - name: Terraform Apply
        run: |
          cd terraform/state-backend
          terraform apply -auto-approve tfplan

      - name: Display Outputs
        run: |
          cd terraform/state-backend
          echo "=== State Backend Created Successfully ==="
          echo ""
          echo "S3 Bucket: $(terraform output -raw terraform_state_bucket)"
          echo "DynamoDB Table: $(terraform output -raw terraform_locks_table)"
          echo ""
          echo "Use these values in your infrastructure pipeline."